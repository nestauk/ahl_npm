name: Publish to PyPI

# Publishes the package to PyPI when a GitHub release is published, building it from the release's tag, which must
# match the version (`v` + `__version__` in ahl_npm/__init__.py). Uses PyPI trusted publishing from the `pypi`
# environment, so no API token is needed. Failed runs can be re-run from the Actions tab, but PyPI never accepts the
# same version twice.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ahl-npm/
    permissions:
      id-token: write # trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag is the version
        run: |
          VERSION=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' ahl_npm/__init__.py)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v + __version__ ($VERSION)."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build the package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
